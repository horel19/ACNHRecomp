name: launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [launcher/**, runtime/**, tools/launcher.sh, .github/workflows/launcher.yml]
  pull_request:
    paths: [launcher/**, runtime/**, tools/launcher.sh, .github/workflows/launcher.yml]

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build patchelf libsdl3-dev

      - name: Configure
        run: |
          cmake -S . -B build/launcher -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNX_GAME=acnh \
            -DNX_GEN_DIR=${{ github.workspace }}/build/no-gen

      - name: Build
        run: cmake --build build/launcher --target acnhrecomp_launcher

      - name: Stage artifact files
        run: |
          mkdir -p dist
          cp build/launcher/acnhrecomp_launcher dist/
          cp "$(ldconfig -p | awk '/libSDL3.so.0/{print $NF; exit}')" dist/
          patchelf --set-rpath '$ORIGIN' dist/acnhrecomp_launcher
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: acnhrecomp_launcher
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get SDL3 (official MSVC devel package)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/libsdl-org/SDL/releases/latest
          $ver = $rel.tag_name -replace '^release-',''
          $url = ($rel.assets | Where-Object { $_.name -eq "SDL3-devel-$ver-VC.zip" }).browser_download_url
          if (-not $url) { throw "SDL3-devel-$ver-VC.zip not found in the latest release" }
          Invoke-WebRequest $url -OutFile sdl3.zip
          Expand-Archive sdl3.zip -DestinationPath sdl3

          # The zip is NAMED SDL3-devel-<ver>-VC.zip but EXTRACTS to a folder named SDL3-<ver>.
          $prefix = Join-Path $env:GITHUB_WORKSPACE "sdl3\SDL3-$ver"
          if (-not (Test-Path $prefix)) {
            # If SDL ever changes the layout again, discover the root instead of failing blind.
            $prefix = (Get-ChildItem "$env:GITHUB_WORKSPACE\sdl3" -Directory | Select-Object -First 1).FullName
            Write-Host "::warning::Expected sdl3\SDL3-$ver; falling back to $prefix"
          }

          $cfg = Get-ChildItem $prefix -Recurse -Filter SDL3Config.cmake | Select-Object -First 1
          if (-not $cfg) { throw "SDL3Config.cmake not found under $prefix" }

          "SDL3_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SDL3_DIR=$($cfg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using SDL3 config: $($cfg.FullName)"

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\build\no-gen" | Out-Null
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build/launcher",
            "-DNX_GAME=acnh",
            "-DNX_GEN_DIR=$env:GITHUB_WORKSPACE\build\no-gen",
            "-DCMAKE_PREFIX_PATH=$env:SDL3_PREFIX",
            "-DSDL3_DIR=$env:SDL3_DIR",
            "-DCMAKE_BUILD_TYPE=Release"
          )
          cmake @cmakeArgs

          # Fail loudly if the launcher target was not generated (SDL3 not found by CMake).
          if (-not (Test-Path "build/launcher/acnhrecomp_launcher.vcxproj")) {
            Write-Host "::error::acnhrecomp_launcher.vcxproj missing - SDL3 not found by CMake."
            Write-Host "SDL3_DIR was: $env:SDL3_DIR"
            if (Test-Path "build/launcher/CMakeFiles/CMakeConfigureLog.yaml") {
              Get-Content "build/launcher/CMakeFiles/CMakeConfigureLog.yaml" -Tail 80
            }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: cmake --build build/launcher --target acnhrecomp_launcher --config Release

      - name: Stage artifact files
        shell: pwsh
        run: |
          $exe = @("build/launcher/Release/acnhrecomp_launcher.exe",
                   "build/launcher/acnhrecomp_launcher.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "acnhrecomp_launcher.exe not found after build" }

          # The package has three SDL3.dll's (lib\x86, lib\x64, lib\arm64) - must pick x64,
          # never fall back to arm64/x86.
          $dll = Get-ChildItem $env:SDL3_PREFIX -Recurse -Filter SDL3.dll |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem $env:SDL3_PREFIX -Recurse -Filter SDL3.dll |
                   Where-Object { $_.FullName -notmatch '\\(arm64|x86)\\' } | Select-Object -First 1
          }
          if (-not $dll) { throw "SDL3.dll not found under $env:SDL3_PREFIX" }

          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item $exe dist/
          Copy-Item $dll.FullName dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: acnhrecomp_launcher-windows
          path: dist/
          if-no-files-found: error
